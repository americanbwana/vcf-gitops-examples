apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  labels:
    app.kubernetes.io/name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: guestbook-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guestbook-ui
    spec:
      automountServiceAccountToken: false
      # Pod-level settings required by the "restricted" Pod Security level.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: guestbook-ui
          # Tag is set by the overlay (kustomize images:). Built from ../../../app.
          image: ghcr.io/americanbwana/vcf-gitops-guestbook:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            # nginx-unprivileged writes its pid and temp files under /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
